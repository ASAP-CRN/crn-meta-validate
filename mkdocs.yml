site_name: ASAP CRN Metadata QC App
site_url: https://asap-crn.github.io/crn-meta-validate/
site_description: Step-by-step guide for validating ASAP CRN metadata before uploading to Google buckets
site_author: DNAstack Bioinformatics

repo_name: ASAP-CRN/crn-meta-validate
repo_url: https://github.com/ASAP-CRN/crn-meta-validate
edit_uri: edit/main/docs/

theme:
  name: material
  # ASAP brand font: Arial is applied via docs/assets/css/extra.css.
  font: false
  palette:
    # primary/accent: custom, not a named Material color (e.g. "teal") — Material's
    # named palettes are fixed hex values with no ASAP-brand option. "custom" tells
    # Material to expect the actual hex values from CSS variables instead, which are
    # defined per color-scheme in docs/assets/css/extra.css.
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs          # top-level sections as tabs
    - navigation.tabs.sticky   # sticky top-menu tabs on scroll
    - navigation.sections      # expand sections in sidebar
    - navigation.expand        # User Guide open by default
    - navigation.top           # back-to-top button
    - content.action.edit      # "edit this page" button
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - User Guide:
    - user-guide/step1-dataset-setup.md
    - user-guide/step2-templates.md
    - user-guide/step3-upload-files.md
    - user-guide/step4-fix-issues.md
    - user-guide/step5-cde-validation.md
  - Changelog: changelog.md
  - FAQ: faq.md
  - About: about.md

markdown_extensions:
  - admonition          # !!! tip / warning / note blocks
  - pymdownx.details    # collapsible admonitions
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]  # resolve --8<-- paths from repo root (e.g. CHANGELOG.md)
  - attr_list           # image sizing: { width="600" }
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - assets/css/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ASAP-CRN/crn-meta-validate
